{% extends "base.html" %}

{% block title %}Login — Búvoli{% endblock %}

{% block public_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm" style="width: 22rem;">
    <div class="card-body p-4">
      <h4 class="card-title mb-1 fw-bold">🐄 Búvoli</h4>
      <p class="text-muted mb-4 small">Livestock Management Platform</p>

      {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
      {% endif %}

      <form method="post" action="/auth/login">
        <div class="mb-3">
          <label class="form-label fw-medium" for="username">Username</label>
          <input class="form-control" type="text" id="username" name="username"
                 autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-medium" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

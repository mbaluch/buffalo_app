[tool.poetry]
name = "buvoli-appka"
version = "0.1.0"
description = "Regional livestock management platform for Czech agricultural cooperatives (JZDs)"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.14"
pydantic = "^2.10"
pydantic-settings = "^2.7"
python-jose = { extras = ["cryptography"], version = "^3.3" }
bcrypt = "^4.0"
python-multipart = "^0.0.20"
jinja2 = "^3.1"
aiosmtplib = "^3.0"
redis = { extras = ["asyncio"], version = "^5.2" }
celery = { extras = ["redis"], version = "^5.4" }
email-validator = "^2.2"
pillow = "^11.0"
openpyxl = "^3.1"
greenlet = "^3.5.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
httpx = "^0.28"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
